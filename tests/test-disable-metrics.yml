name: Test flox installation with metrics disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"
      - name: Assert flox-version output is set
        env:
          FLOX_VERSION: ${{ steps.install.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox-version=$FLOX_VERSION"
      - name: Assert flox-path output is set and binary exists
        env:
          FLOX_PATH: ${{ steps.install.outputs.flox-path }}
        run: |
          echo "flox-path: $FLOX_PATH"
          if [ -z "$FLOX_PATH" ]; then
            echo "FAIL: flox-path output is empty"
            exit 1
          fi
          if [ ! -f "$FLOX_PATH" ]; then
            echo "FAIL: flox binary not found at $FLOX_PATH"
            exit 1
          fi
          echo "PASS: flox binary exists at $FLOX_PATH"
      - name: Assert FLOX_DISABLE_METRICS env is respected
        run: |
          # When disable-metrics is true, the action should set FLOX_DISABLE_METRICS=true
          echo "FLOX_DISABLE_METRICS=${FLOX_DISABLE_METRICS}"
          if [ "$FLOX_DISABLE_METRICS" = "true" ] || [ "$FLOX_DISABLE_METRICS" = "1" ]; then
            echo "PASS: metrics are disabled"
          else
            echo "INFO: FLOX_DISABLE_METRICS not set in env (may be set in flox config instead)"
            echo "PASS: installation succeeded with disable-metrics=true"
          fi
