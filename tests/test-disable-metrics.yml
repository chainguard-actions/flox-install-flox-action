name: Test disable-metrics input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"

      - name: Assert FLOX_DISABLE_METRICS env var is set
        run: |
          echo "FLOX_DISABLE_METRICS: $FLOX_DISABLE_METRICS"
          if [ "$FLOX_DISABLE_METRICS" != "true" ]; then
            echo "FAIL: expected FLOX_DISABLE_METRICS=true, got '$FLOX_DISABLE_METRICS'"
            exit 1
          fi
          echo "PASS: FLOX_DISABLE_METRICS is 'true'"

      - name: Assert flox is installed and functional
        env:
          FLOX_VERSION: ${{ steps.install.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox installed with metrics disabled, version '$FLOX_VERSION'"
