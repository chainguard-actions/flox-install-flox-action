name: Test flox installation with metrics disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"
      - name: Assert flox-version output is set
        env:
          FLOX_VERSION: ${{ steps.action.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox installed with metrics disabled, version=$FLOX_VERSION"
      - name: Assert flox binary works
        run: |
          if ! command -v flox >/dev/null 2>&1; then
            echo "FAIL: flox not found on PATH"
            exit 1
          fi
          flox --version
          echo "PASS: flox binary is functional"
