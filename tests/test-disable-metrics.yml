name: Test Flox installation with metrics disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install-flox
        name: Install Flox with metrics disabled
        uses: .
        with:
          disable-metrics: "true"

      - name: Assert flox-version output is set
        env:
          FLOX_VERSION: ${{ steps.install-flox.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox-version=$FLOX_VERSION"

      - name: Assert flox-path output is set and binary exists
        env:
          FLOX_PATH: ${{ steps.install-flox.outputs.flox-path }}
        run: |
          echo "flox-path: $FLOX_PATH"
          if [ -z "$FLOX_PATH" ]; then
            echo "FAIL: flox-path output is empty"
            exit 1
          fi
          if [ ! -x "$FLOX_PATH" ]; then
            echo "FAIL: flox binary not found or not executable at $FLOX_PATH"
            exit 1
          fi
          echo "PASS: flox binary exists at $FLOX_PATH"

      - name: Assert FLOX_DISABLE_METRICS env is honored
        run: |
          echo "Checking FLOX_DISABLE_METRICS environment variable"
          echo "FLOX_DISABLE_METRICS=${FLOX_DISABLE_METRICS:-<not set>}"
          # The action should have set FLOX_DISABLE_METRICS=true in the environment
          # or the binary should respect the disable-metrics input
          # We just verify flox runs without error
          FLOX_OUT=$(flox --version 2>&1) || true
          echo "flox --version output: $FLOX_OUT"
          if [ -z "$FLOX_OUT" ]; then
            echo "FAIL: flox --version produced no output"
            exit 1
          fi
          echo "PASS: flox runs with metrics disabled"
