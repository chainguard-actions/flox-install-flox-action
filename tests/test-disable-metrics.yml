name: Test flox installation with metrics disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"
      - name: Assert flox-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.flox-version }}
        run: |
          echo "actual flox-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox-version=$ACTUAL"
      - name: Assert flox is on PATH
        run: |
          echo "checking flox on PATH"
          which flox
          if [ $? -ne 0 ]; then
            echo "FAIL: flox not found on PATH"
            exit 1
          fi
          echo "PASS: flox found on PATH at $(which flox)"
      - name: Assert flox version matches output
        env:
          EXPECTED_VERSION: ${{ steps.action.outputs.flox-version }}
        run: |
          echo "expected version: $EXPECTED_VERSION"
          ACTUAL_VERSION=$(flox --version 2>&1 | head -1)
          echo "actual version from binary: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: flox --version returned empty"
            exit 1
          fi
          echo "PASS: flox version output: $ACTUAL_VERSION"
