name: Test flox installation with extra config options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"
          extra-nix-config: |
            max-jobs = auto
          extra-flox-config: |
            search_limit=20
          disable-upgrade-notifications: "true"
      - name: Assert flox-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.flox-version }}
        run: |
          echo "actual flox-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox-version=$ACTUAL"
      - name: Assert flox-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.flox-path }}
        run: |
          echo "actual flox-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: flox-path output is empty"
            exit 1
          fi
          echo "PASS: flox-path=$ACTUAL"
      - name: Assert nix-detected output is boolean
        env:
          ACTUAL: ${{ steps.action.outputs.nix-detected }}
        run: |
          echo "actual nix-detected: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: nix-detected should be 'true' or 'false', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: nix-detected=$ACTUAL"
      - name: Assert flox binary is functional
        run: |
          echo "verifying flox binary works"
          flox --version
          if [ $? -ne 0 ]; then
            echo "FAIL: flox --version failed"
            exit 1
          fi
          echo "PASS: flox is functional"
