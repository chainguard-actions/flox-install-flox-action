name: Test Flox installation with write-summary enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-flox
        uses: .
        with:
          disable-metrics: "true"
          disable-upgrade-notifications: "true"
          write-summary: "true"
          use-cache: "false"
      - name: Assert flox-version output is set
        env:
          FLOX_VERSION: ${{ steps.install-flox.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty"
            exit 1
          fi
          echo "PASS: flox-version=$FLOX_VERSION"
      - name: Assert flox-path output is set and binary exists
        env:
          FLOX_PATH: ${{ steps.install-flox.outputs.flox-path }}
        run: |
          echo "flox-path: $FLOX_PATH"
          if [ -z "$FLOX_PATH" ]; then
            echo "FAIL: flox-path output is empty"
            exit 1
          fi
          if [ ! -f "$FLOX_PATH" ]; then
            echo "FAIL: flox binary not found at $FLOX_PATH"
            exit 1
          fi
          echo "PASS: flox binary exists at $FLOX_PATH"
      - name: Assert nix-detected output is boolean
        env:
          NIX_DETECTED: ${{ steps.install-flox.outputs.nix-detected }}
        run: |
          echo "nix-detected: $NIX_DETECTED"
          if [ "$NIX_DETECTED" != "true" ] && [ "$NIX_DETECTED" != "false" ]; then
            echo "FAIL: nix-detected must be 'true' or 'false', got '$NIX_DETECTED'"
            exit 1
          fi
          echo "PASS: nix-detected=$NIX_DETECTED"
      - name: Assert flox runs successfully
        run: |
          flox --version
          echo "PASS: flox --version succeeded"
