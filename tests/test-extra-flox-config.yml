name: Test extra-flox-config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install
        uses: .
        with:
          channel: stable
          disable-metrics: "true"
          use-cache: "false"
          extra-flox-config: |
            search_limit=20

      - name: Assert flox-version output is set (extra-flox-config)
        env:
          FLOX_VERSION: ${{ steps.install.outputs.flox-version }}
        run: |
          echo "flox-version: $FLOX_VERSION"
          if [ -z "$FLOX_VERSION" ]; then
            echo "FAIL: flox-version output is empty when extra-flox-config is set"
            exit 1
          fi
          echo "PASS: flox installed with extra-flox-config, version '$FLOX_VERSION'"

      - name: Assert flox-path output is set (extra-flox-config)
        env:
          FLOX_PATH: ${{ steps.install.outputs.flox-path }}
        run: |
          echo "flox-path: $FLOX_PATH"
          if [ -z "$FLOX_PATH" ]; then
            echo "FAIL: flox-path output is empty when extra-flox-config is set"
            exit 1
          fi
          echo "PASS: flox-path is '$FLOX_PATH'"

      - name: Assert flox binary is functional (extra-flox-config)
        run: |
          if ! command -v flox >/dev/null 2>&1; then
            echo "FAIL: flox is not on PATH"
            exit 1
          fi
          echo "PASS: flox is on PATH with extra-flox-config applied"
          flox --version
